<app-hero-section></app-hero-section>

<div class="sf-container product-page mt-4 mb-5 app-fade-in">
  <sf-page-intro
    title="SẢN PHẨM THỦ CÔNG CLAY ART"
    subtitle="Khám phá các sản phẩm nghệ thuật độc bản, được chế tác tỉ mỉ từ đôi bàn tay của những nghệ nhân tâm huyết. Mỗi tác phẩm mang một câu chuyện riêng."
    align="center">
    
    <sf-chip-group
      [items]="categories"
      [active]="selectedCategory"
      [toggleable]="false"
      (selected)="onCategorySelect($event)">
    </sf-chip-group>
  </sf-page-intro>

  @if (loadError) {
    <sf-state
      title="Lỗi tải dữ liệu"
      [text]="loadError"
      icon="bi-exclamation-triangle"
      actionLabel="Thử lại"
      (action)="getAll(currentPage, pageSize)">
    </sf-state>
  } @else {
    <sf-product-grid
      [products]="filteredProducts"
      [loading]="isLoading"
      [skeletonCount]="12"
      [showFavorite]="canUseWishlist"
      [favoriteIds]="favoriteProductIds"
      [busyIds]="favoriteBusyProductIds"
      (favoriteToggled)="toggleFavorite($event)"
      (viewed)="viewProduct($event.id)"
      (buy)="openAddToCartModal($event)">
      <sf-state
        sfEmpty
        title="Không tìm thấy sản phẩm"
        text="Không có sản phẩm nào khớp với điều kiện lọc của bạn."
        icon="bi-search"
        actionLabel="Xóa bộ lọc"
        (action)="clearFilters()">
      </sf-state>
    </sf-product-grid>

    @if (totalPages > 1 && !isLoading) {
      <div class="mt-5">
        <app-pagination
          [currentPage]="currentPage"
          [totalPages]="totalPages"
          [totalElements]="totalElements"
          [pageSize]="pageSize"
          [pageSizeOptions]="pageSizeOptions"
          [disabled]="isLoading"
          (pageChange)="changePage($event)"
          (pageSizeChange)="changePageSize($event)">
        </app-pagination>
      </div>
    }
  }
</div>
