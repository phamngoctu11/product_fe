<section class="hero-section">
  <!-- Background texture -->
  <div class="hero-bg-texture"></div>

  <!-- Các ảnh sản phẩm trôi nổi -->
  <div class="hero-float-images" aria-hidden="true">
    <div class="hero-img-wrap hero-img-1 float-anim-1">
      <img src="/images/storefront/hero-hands-clay.jpg" alt="" class="hero-img-inner">
    </div>
    <div class="hero-img-wrap hero-img-2 float-anim-2">
      <img src="/images/storefront/hero-white-ceramics.jpg" alt="" class="hero-img-inner">
    </div>
    <div class="hero-img-wrap hero-img-3 float-anim-3">
      <img src="/images/storefront/hero-plate-pattern.jpg" alt="" class="hero-img-inner">
    </div>
    <div class="hero-img-wrap hero-img-4 float-anim-1" style="animation-delay: -2s;">
      <img src="/images/storefront/hero-clay-figurine.jpg" alt="" class="hero-img-inner">
    </div>
  </div>

  <!-- Nội dung Hero chính giữa -->
  <div class="hero-content">
    <h1 class="hero-headline">
      <span class="hero-headline__line1">WE ARE</span>
      <span class="hero-headline__line2">CLAYART</span>
    </h1>

    <div class="hero-actions">
      <a class="hero-btn hero-btn--primary" routerLink="/store/product">
        Cửa hàng
      </a>
      <a class="hero-btn hero-btn--ghost" routerLink="/store/consultations">
        Đặt làm riêng
      </a>
    </div>
  </div>

  <!-- Scroll indicator -->
  <div class="hero-scroll-hint" aria-hidden="true">
    <span>Keep scrolling</span>
    <i class="bi bi-chevron-down hero-scroll-icon"></i>
  </div>
</section>
