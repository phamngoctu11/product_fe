<div class="sf-container wishlist-page mt-4 mb-5 app-fade-in">
  <sf-page-intro
    title="Danh sách Yêu thích"
    subtitle="Những sản phẩm bạn đã lưu để xem lại sau."
    align="center">
  </sf-page-intro>

  @if (loadError) {
    <sf-state
      title="Lỗi tải dữ liệu"
      [text]="loadError"
      icon="bi-exclamation-triangle"
      actionLabel="Thử lại"
      (action)="loadWishlist(currentPage)">
    </sf-state>
  } @else {
    <sf-product-grid
      [products]="products"
      [loading]="isLoading"
      [skeletonCount]="6"
      [showFavorite]="true"
      [favoriteIds]="favoriteIds"
      [busyIds]="favoriteBusyProductIds"
      (favoriteToggled)="removeFavorite($event)"
      (viewed)="viewProduct($event.id)">
      <sf-state
        sfEmpty
        title="Chưa có sản phẩm yêu thích"
        text="Bạn chưa thêm sản phẩm nào vào danh sách yêu thích. Hãy khám phá và lưu lại những sản phẩm ưng ý nhé!"
        icon="bi-heart"
        actionLabel="Về cửa hàng">
      </sf-state>
    </sf-product-grid>

    @if (totalPages > 1 && !isLoading) {
      <div class="mt-5">
        <app-pagination
          [currentPage]="currentPage"
          [totalPages]="totalPages"
          [totalElements]="totalElements"
          [pageSize]="pageSize"
          [pageSizeOptions]="pageSizeOptions"
          [disabled]="isLoading"
          (pageChange)="changePage($event)"
          (pageSizeChange)="changePageSize($event)">
        </app-pagination>
      </div>
    }
  }
</div>
