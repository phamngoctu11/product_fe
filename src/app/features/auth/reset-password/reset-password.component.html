<div class="auth-page-wrapper">
  <div class="auth-panel-left">
    <div class="auth-panel-content">
      <div class="auth-panel-logo">
        <div class="auth-panel-logo-mark">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <span class="auth-panel-logo-name">ShopVN</span>
      </div>

      <h2 class="auth-panel-tagline">Bảo vệ tài khoản<br>của bạn</h2>
      <p class="auth-panel-desc">Đặt lại mật khẩu bằng liên kết bảo mật một lần được gửi qua email.</p>
    </div>
  </div>

  <div class="auth-panel-right">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="auth-icon-wrap">
          <i class="bi bi-key-fill"></i>
        </div>
        <h1 class="auth-card-title">Đặt lại mật khẩu</h1>
        <p class="auth-card-subtitle">Nhập mật khẩu mới cho tài khoản của bạn.</p>
      </div>

      <div *ngIf="successMessage" class="auth-alert auth-alert-success">
        <i class="bi bi-check-circle-fill"></i>
        <span>{{ successMessage }}</span>
      </div>

      <div *ngIf="errorMessage" class="auth-alert auth-alert-warning">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span>{{ errorMessage }}</span>
      </div>

      <form #resetForm="ngForm" (ngSubmit)="submit(resetForm)" novalidate>
        <div class="auth-form-group">
          <label class="auth-form-label">Mật khẩu mới</label>
          <div class="auth-input-group">
            <i class="bi bi-lock auth-input-icon"></i>
            <input
              type="password"
              class="auth-input"
              name="newPassword"
              #newPassword="ngModel"
              [(ngModel)]="passwordData.newPassword"
              required
              minlength="6"
              maxlength="100"
              placeholder="Nhập mật khẩu mới" />
          </div>
          <div class="auth-error" *ngIf="newPassword.invalid && newPassword.touched">
            <i class="bi bi-exclamation-circle"></i> Mật khẩu phải có từ 6 đến 100 ký tự.
          </div>
        </div>

        <div class="auth-form-group auth-form-group-spacious">
          <label class="auth-form-label">Xác nhận mật khẩu</label>
          <div class="auth-input-group">
            <i class="bi bi-shield-lock auth-input-icon"></i>
            <input
              type="password"
              class="auth-input"
              name="confirmPassword"
              #confirmPassword="ngModel"
              [(ngModel)]="passwordData.confirmPassword"
              required
              placeholder="Nhập lại mật khẩu mới" />
          </div>
          <div class="auth-error" *ngIf="confirmPassword.touched && passwordData.newPassword !== passwordData.confirmPassword">
            <i class="bi bi-exclamation-circle"></i> Mật khẩu xác nhận không khớp.
          </div>
        </div>

        <button
          type="submit"
          class="auth-btn"
          [disabled]="isSubmitting || resetForm.invalid || passwordData.newPassword !== passwordData.confirmPassword">
          <span *ngIf="isSubmitting" class="auth-btn-spinner"></span>
          <span *ngIf="isSubmitting">Đang cập nhật...</span>
          <ng-container *ngIf="!isSubmitting">
            <i class="bi bi-check2-circle"></i> Cập nhật mật khẩu
          </ng-container>
        </button>
      </form>

      <div class="auth-toggle">
        <a routerLink="/login" class="auth-toggle-link">Quay lại đăng nhập</a>
      </div>
    </div>
  </div>
</div>
