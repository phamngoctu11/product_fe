<div class="container mt-4 mb-5 app-fade-in">
  <app-page-header
    icon="bi-people"
    title="Quản lý người dùng"
    subtitle="Quản lý tài khoản, vai trò và trạng thái người dùng">
    <button pageActions class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm d-flex align-items-center" (click)="openUserDialog()">
      <i class="bi bi-person-plus-fill me-2 fs-5"></i> Thêm Người Dùng
    </button>
  </app-page-header>

  <div class="card shadow-sm border-0 rounded-4 mb-4">
    <div class="card-body p-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
      <h5 class="mb-0 fw-bold text-dark d-flex align-items-center">
        <i class="bi bi-list-ul text-primary me-2"></i>Danh sách tài khoản
      </h5>
      <div class="user-search input-group shadow-sm rounded-pill overflow-hidden border" title="Tìm kiếm theo tên...">
        <span class="input-group-text bg-light border-0 ps-4"><i class="bi bi-search text-muted"></i></span>
        <input
          type="text"
          class="form-control border-0 bg-light shadow-none"
          placeholder="Nhập tên người dùng..."
          [(ngModel)]="searchTerm"
          (ngModelChange)="filterUsers()"
        />
      </div>
      <div class="d-flex align-items-center flex-wrap gap-3">
        <span class="small fw-semibold text-muted"><i class="bi bi-funnel me-1"></i>Lọc vai trò:</span>
        <div class="form-check form-check-inline mb-0" *ngFor="let role of roleOptions">
          <input
            class="form-check-input"
            type="checkbox"
            [id]="'role-' + role.value"
            [(ngModel)]="roleFilters[role.value]"
            (change)="onRoleFilterChange()" />
          <label class="form-check-label small fw-semibold" [for]="'role-' + role.value">
            {{ role.label }}
          </label>
        </div>
        <button *ngIf="hasRoleFilters()" type="button" class="btn btn-sm btn-outline-secondary rounded-pill" (click)="clearRoleFilters()">
          Xóa lọc
        </button>
      </div>
    </div>
  </div>

  <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
    <div class="card-body p-0">
      <app-view-state
        [empty]="filteredUsers.length === 0"
        [card]="false"
        emptyTitle="Chưa có dữ liệu"
        [emptyText]="searchTerm ? 'Không tìm thấy người dùng nào phù hợp với từ khóa.' : 'Chưa có người dùng nào.'"
        emptyIcon="bi-people">
      <div class="table-responsive">
        <table class="table table-hover table-custom align-middle mb-0">
          <thead class="table-light text-secondary text-uppercase small text-center">
            <tr class="fw-semibold">
              <th scope="col" class="user-id-column">ID</th>
              <th scope="col" class="user-name-column text-start ps-4">Họ và Tên</th>
              <th scope="col" class="user-role-column">Vai trò</th>
              <th scope="col" class="user-reputation-column">Uy tín</th>
              <th scope="col" class="user-actions-column">Thao tác</th>
            </tr>
          </thead>
          <tbody>
            @for (u of filteredUsers; track u.id) {
              <tr (click)="viewUser(u.id)" class="user-row hover-elevate">
                <td class="text-center fw-bold text-muted">{{ u.id }}</td>
                <td class="ps-4">
                  <div class="d-flex align-items-center">

                    <div class="user-avatar rounded-circle d-flex justify-content-center align-items-center me-3 shadow-sm overflow-hidden">
                      <img *ngIf="u.avatar_url" [src]="u.avatar_url" class="user-avatar-image">
                      <span *ngIf="!u.avatar_url" class="fw-bold fs-5">
                        {{ u.firstname.charAt(0) | uppercase }}
                      </span>
                    </div>

                    <div class="fw-bold text-dark fs-6">{{ u.lastname }} {{ u.firstname }}</div>
                  </div>
                </td>
                <td class="text-center">
                  <span class="badge rounded-pill px-3 py-2"
                        [ngClass]="u.role === 'ADMIN' ? 'bg-danger bg-opacity-10 text-danger' : 'bg-primary bg-opacity-10 text-primary'">
                    <i class="bi" [ngClass]="u.role === 'ADMIN' ? 'bi-shield-lock-fill' : 'bi-person-badge'"></i> {{ u.role }}
                  </span>
                </td>
                <td class="text-center">
                  <span class="badge bg-warning bg-opacity-10 text-warning border border-warning border-opacity-50 px-3 py-2 rounded-pill shadow-sm">
                    <i class="bi bi-star-fill text-warning me-1"></i> <span class="text-dark">{{ u.reputation }}</span>
                  </span>
                </td>
                <td class="text-center">
                  <div class="d-flex gap-2 justify-content-center">
                    @if(isAdmin){
                      <div class="d-flex gap-2">
                        <button
                          class="btn-icon-action edit"
                          (click)="openUserDialog(u.id); $event.stopPropagation()"
                          title="Chỉnh sửa"
                        >
                          <i class="bi bi-pencil-square"></i>
                        </button>
                        <button
                          class="btn-icon-action delete"
                          (click)="deleteUser(u.id); $event.stopPropagation()"
                          title="Xóa"
                        >
                          <i class="bi bi-trash"></i>
                        </button>
                      </div>
                    }
                  </div>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
      </app-view-state>
    </div>
  </div>

  <app-pagination
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    [totalElements]="totalElements"
    [pageSize]="pageSize"
    [pageSizeOptions]="pageSizeOptions"
    (pageChange)="changePage($event)"
    (pageSizeChange)="changePageSize($event)">
  </app-pagination>
</div>
