<div
  *ngIf="authService.isLoggedIn() && !authService.isAdmin() && !authService.isStaff()"
  class="chat-widget-root position-fixed bottom-0 end-0 m-4">
  @if (isOpen) {
    <section class="chat-widget-window shadow-lg rounded-4 d-flex flex-column overflow-hidden border-0">
      <header class="bg-primary bg-gradient text-white p-3 d-flex justify-content-between align-items-center shadow-sm">
        <div class="d-flex align-items-center gap-2">
          <span class="chat-widget-header-icon"><i class="bi bi-headset"></i></span>
          <h2 class="mb-0 fw-bold">CSKH Trực tuyến</h2>
        </div>
        <button type="button" class="btn btn-sm btn-link text-white p-0" aria-label="Đóng chat" (click)="toggleChat()">
          <i class="bi bi-x-lg fs-5"></i>
        </button>
      </header>

      <app-chat-message-list
        class="chat-widget-messages flex-grow-1 overflow-auto p-3 chat-scrollbar"
        #chatBody
        [messages]="messages">
      </app-chat-message-list>

      <footer class="chat-widget-input p-3 border-top d-flex align-items-center gap-2">
        <input
          type="text"
          class="form-control rounded-pill shadow-none px-3"
          placeholder="Nhập tin nhắn..."
          [(ngModel)]="newMessage"
          (keyup.enter)="sendMessage()">
        <button type="button" class="chat-widget-send btn btn-primary rounded-circle shadow-sm" aria-label="Gửi tin nhắn" (click)="sendMessage()">
          <i class="bi bi-send-fill"></i>
        </button>
      </footer>
    </section>
  } @else {
    <button
      type="button"
      class="chat-btn-float btn border-0 rounded-circle shadow-lg text-white float-end mt-3"
      aria-label="Mở hỗ trợ trực tuyến"
      (click)="toggleChat()">
      <i class="bi bi-chat-dots-fill fs-2"></i>
    </button>
  }
</div>
