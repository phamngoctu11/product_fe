@if (loading) {
  <div class="view-state" [class.view-state-card]="card" role="status">
    <div class="spinner-border text-primary" aria-hidden="true"></div>
    <span>{{ loadingText }}</span>
  </div>
} @else if (error) {
  <div class="view-state view-state-error" [class.view-state-card]="card" role="alert">
    <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
    <strong>Không thể tải dữ liệu</strong>
    <span>{{ error }}</span>
    @if (actionLabel) {
      <button type="button" class="btn btn-outline-danger rounded-pill px-4" (click)="action.emit()">
        <i [class]="'bi ' + actionIcon" aria-hidden="true"></i>
        {{ actionLabel }}
      </button>
    }
  </div>
} @else if (empty) {
  <div class="view-state" [class.view-state-card]="card">
    <i [class]="'bi ' + emptyIcon + ' view-state-icon'" aria-hidden="true"></i>
    <strong>{{ emptyTitle }}</strong>
    @if (emptyText) {
      <span>{{ emptyText }}</span>
    }
    @if (actionLabel) {
      <button type="button" class="btn btn-outline-primary rounded-pill px-4" (click)="action.emit()">
        <i [class]="'bi ' + actionIcon" aria-hidden="true"></i>
        {{ actionLabel }}
      </button>
    }
  </div>
} @else {
  <ng-content></ng-content>
}
