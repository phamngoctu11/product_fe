<div class="modal-content shadow-lg border-0 rounded-4 overflow-hidden">
  <div class="modal-header bg-primary bg-gradient text-white border-0 p-4">
    <h5 mat-dialog-title class="modal-title fw-bold m-0 fs-4 order-dialog-title">
      <i class="bi bi-receipt-cutoff me-2"></i>Lịch sử đơn hàng của người dùng
    </h5>
    <button mat-dialog-close type="button" class="btn-close btn-close-white"></button>
  </div>

  <mat-dialog-content class="order-dialog-content p-4 bg-light">
    <app-view-state
      [loading]="isLoading"
      [empty]="orders.length === 0"
      [card]="false"
      loadingText="Đang tải đơn hàng..."
      emptyTitle="Chưa có đơn hàng"
      emptyText="Người dùng này chưa có đơn hàng nào.">
      @for (order of orders; track order.id) {
        <app-order-summary-card [order]="order" (selected)="openOrderDetail($event)"></app-order-summary-card>
      }
      <app-pagination
        [currentPage]="currentPage"
        [totalPages]="totalPages"
        [totalElements]="totalElements"
        [pageSize]="pageSize"
        [pageSizeOptions]="pageSizeOptions"
        [disabled]="isLoading"
        [compact]="true"
        (pageChange)="changePage($event)"
        (pageSizeChange)="changePageSize($event)">
      </app-pagination>
    </app-view-state>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="p-4 bg-white border-top m-0">
    <button class="btn btn-secondary rounded-pill px-4 fw-bold shadow-sm" mat-dialog-close>Đóng</button>
  </mat-dialog-actions>
</div>

<app-order-detail-popup
  [order]="selectedOrderDetail"
  [isLoading]="isDetailLoading"
  [error]="detailError"
  (close)="closeOrderDetail()">
</app-order-detail-popup>
