const gallery = document.getElementById('gallery');
for (const role of ['user','manager','staff']) {
  const entries = items.filter(item => item.role === role);
  const section = document.createElement('section'); section.className = 'role'; section.dataset.role = role;
  const heading = document.createElement('h2'); heading.textContent = `${role} (${entries.length})`; section.appendChild(heading);
  const grid = document.createElement('div'); grid.className = 'grid';
  for (const item of entries) {
    const card = document.createElement('article'); card.className = 'card'; card.dataset.search = item.file.toLowerCase();
    const link = document.createElement('a'); link.href = item.file; link.target = '_blank'; link.rel = 'noreferrer';
    const img = document.createElement('img'); img.src = item.file; img.loading = 'lazy'; img.alt = `${role}: ${item.file.split('/').pop()}`; link.appendChild(img); card.appendChild(link);
    const caption = document.createElement('div'); caption.className = 'caption';
    const name = document.createElement('a'); name.href = item.file; name.target = '_blank'; name.textContent = item.file.split('/').pop(); caption.appendChild(name);
    const route = document.createElement('small'); route.textContent = item.route; caption.appendChild(route); card.appendChild(caption); grid.appendChild(card);
  }
  section.appendChild(grid); gallery.appendChild(section);
}
let activeRole = 'all';
function filter() { const query = document.getElementById('search').value.toLowerCase(); document.querySelectorAll('.role').forEach(section => { section.classList.toggle('hide', activeRole !== 'all' && section.dataset.role !== activeRole); section.querySelectorAll('.card').forEach(card => card.classList.toggle('hide', !card.dataset.search.includes(query))); }); }
document.querySelectorAll('[data-role]').forEach(button => button.addEventListener('click', () => { activeRole=button.dataset.role; document.querySelectorAll('.tools button').forEach(item=>item.classList.toggle('active',item===button)); filter(); }));
document.getElementById('search').addEventListener('input',filter);filter();
